name: Tests
on: [push, pull_request]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install -e ".[test,plots]"
      - run: python -m pytest
      - run: python -m marksix demo --output "${RUNNER_TEMP}/marksix-demo"
      - run: python scripts/render_figures.py --output-dir "${RUNNER_TEMP}/figures"
